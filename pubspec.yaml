name: orbi_mobileapp
description: "ORBI Sovereign - Platinum Institutional Ledger"
version: 1.0.0+1
publish_to: 'none'

# This section defines the Dart SDK version
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Branding
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  
  # State & Networking (DIO is the master client for ORBI)
  provider: ^6.1.5+1
  dio: ^5.9.2
  web_socket_channel: ^3.0.3
  http: ^1.2.0
  intl: ^0.20.2
  crypto: ^3.0.6
  
  # Security, Identity & Storage
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.3
  local_auth: ^3.0.1
  shared_preferences: ^2.2.2
  device_info_plus: ^11.5.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  sms_autofill: ^2.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  flutter_ringtone_player: ^4.0.0+4
  url_launcher: ^6.3.1
  flutter_svg: ^2.2.0
  printing: ^5.14.2
  pdf: ^3.11.3
  fl_chart: ^1.2.0
  image: ^4.5.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.4.0
  flutter_appauth: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/brand/
    - assets/icons/
    - assets/fonts/
    - assets/providers/
    - assets/providers/Tanzania/Logos/
    - assets/providers/Tanzania/Bundles/
    - assets/providers/Tanzania/Electricity/
    - assets/providers/Tanzania/Entertainment/
    - assets/providers/Tanzania/Gas/
    - assets/providers/Tanzania/Government Bills/
    - assets/providers/Tanzania/Insurance/
    - assets/providers/Tanzania/Internet/
    - assets/providers/Tanzania/Other Bills/
    - assets/providers/Tanzania/School Fees/
    - assets/providers/Tanzania/Telephone/
    - assets/providers/Tanzania/Water Bills/
    - assets/providers/Tanzania/Deposit/Banks/
    - assets/providers/Tanzania/Deposit/Mobile Money/
    - assets/providers/Tanzania/Transfers/Banks/
    - assets/providers/Tanzania/Transfers/Mobile Money/
    - assets/providers/Tanzania/Withdraw/Banks/
    - assets/providers/Tanzania/Withdraw/Mobile Money/
    - assets/providers/Tanzania/Withdraw/External Agents/
