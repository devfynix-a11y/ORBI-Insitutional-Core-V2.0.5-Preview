services:
  gateway:
    image: ${ORBI_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: orbi-gateway
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ORBI_TLS_CERT_DIRECTORY:-./Gateway/certs}:/etc/orbi/tls:ro
    networks:
      - orbi_edge

networks:
  orbi_edge:
    name: orbi-edge
    driver: bridge
