user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format orbi_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request_id":"$request_id","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log orbi_json;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=orbi_api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=orbi_conn:10m;

    upstream orbi_core {
        server core:3000;
        keepalive 64;
    }

    upstream orbi_identity {
        server keycloak:8080;
        keepalive 32;
    }

    upstream orbi_pay_gateway {
        server pay-gateway:3100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name auth.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            add_header Cache-Control "no-store" always;
            root /usr/share/nginx/orbi-auth;
            try_files /index.html =404;
        }

        location / {
            limit_req zone=orbi_api burst=30 nodelay;
            limit_conn orbi_conn 20;

            proxy_pass http://orbi_identity;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
        }
    }

    server {
        listen 80;
        server_name api.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://orbi_core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbi_api burst=60 nodelay;
            limit_conn orbi_conn 40;

            proxy_pass http://orbi_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name pay.orbifinancial.com sandbox-pay.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://orbi_pay_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /ready {
            proxy_pass http://orbi_pay_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbi_api burst=40 nodelay;
            limit_conn orbi_conn 30;

            proxy_pass http://orbi_pay_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name ops.orbifinancial.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location / {
            limit_req zone=orbi_api burst=20 nodelay;
            limit_conn orbi_conn 10;

            proxy_pass http://orbi_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
