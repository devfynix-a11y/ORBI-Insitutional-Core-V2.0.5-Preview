services:
  pay-gateway:
    profiles:
      - live
    build:
      context: D:/FYNIX/ORBI/Orbi Infrastructures/ORBI GATEWAY/Pay Gateway Backend
      dockerfile: Dockerfile
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    container_name: orbi-pay-gateway
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_LIVE_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY LIVE ENV.txt}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3100
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: https://pay.orbifinancial.com
      PAYMENT_GATEWAY_PROVIDER_MODE: live
      PAYMENT_GATEWAY_CREDENTIAL_MODE: tokenized
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: "true"
      PAYMENT_GATEWAY_INTERNAL_CORE_TRANSPORT_MODE: private_http
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER:-https://pay.orbifinancial.com}
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE:-orbi-pay-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-api}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: "false"
      PAYMENT_GATEWAY_RECONCILIATION_EXPORT_PATH: /app/reconciliation
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_INTERVAL_MINUTES: "1440"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_WINDOW_HOURS: "24"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_RUN_ON_START: "false"
      PAYMENT_GATEWAY_OPERATOR_ALERT_SINK_PATH: /app/alerts/reconciliation-alerts.jsonl
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_ENABLED: "true"
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_INTERVAL_MINUTES: "5"
      PAYMENT_GATEWAY_INCIDENT_CRITICAL_SLA_MINUTES: "15"
      PAYMENT_GATEWAY_INCIDENT_WARNING_SLA_MINUTES: "60"
      PAYMENT_GATEWAY_ORBI_TALK_ENABLED: ${PAYMENT_GATEWAY_ORBI_TALK_ENABLED:-true}
      ORBI_TALK_GATEWAY_URL: ${ORBI_TALK_GATEWAY_URL:-https://talk.orbifinancial.com}
      ORBI_TALK_MESSAGING_INTENT_PATH: /api/send-email
      ORBI_TALK_GATEWAY_TIMEOUT_MS: ${ORBI_TALK_GATEWAY_TIMEOUT_MS:-2500}
      PAYMENT_GATEWAY_MESSAGING_DELIVERY_STORE_PATH: /app/messaging/messaging-deliveries.json
    volumes:
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/providers.example.json:/app/config/providers.json:ro
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/services.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_RECONCILIATION_REPORTS_ROOT:-../../../../../../ORBI GATEWAY/Reconciliation Reports/live}:/app/reconciliation
      - ${ORBI_PAY_GATEWAY_ALERTS_ROOT:-../../../../../../ORBI GATEWAY/Operator Alerts/live}:/app/alerts
      - ${ORBI_PAY_GATEWAY_MESSAGING_ROOT:-../../../../../../ORBI GATEWAY/Messaging Deliveries/live}:/app/messaging
      - ${ORBI_PAY_GATEWAY_MTLS_CERT_DIRECTORY:-D:/FYNIX/ORBI/SECREATES/ORBI_MTLS}:/opt/orbi/mtls:ro
    ports:
      - "${ORBI_PAY_GATEWAY_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - orbi_private
      - orbi_edge

  pay-gateway-sandbox:
    profiles:
      - sandbox
    build:
      context: D:/FYNIX/ORBI/Orbi Infrastructures/ORBI GATEWAY/Pay Gateway Backend
      dockerfile: Dockerfile
    image: orbi-pay-gateway:${ORBI_PAY_GATEWAY_RELEASE_ID:-local}
    container_name: orbi-pay-gateway-sandbox
    restart: unless-stopped
    env_file:
      - ${ORBI_PAY_GATEWAY_SANDBOX_ENV_FILE:-D:/FYNIX/ORBI/SECREATES/ORBI PAY GATEWAY SANDBOX ENV.txt}
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY_PORT: 3101
      PAYMENT_GATEWAY_PUBLIC_BASE_URL: https://sandbox-pay.orbifinancial.com
      PAYMENT_GATEWAY_PROVIDER_MODE: sandbox
      PAYMENT_GATEWAY_CREDENTIAL_MODE: tokenized
      PAYMENT_GATEWAY_REQUIRE_STRONG_CUSTOMER_AUTH: "true"
      PAYMENT_GATEWAY_INTERNAL_CORE_TRANSPORT_MODE: private_http
      PAYMENT_GATEWAY_OIDC_IDENTITY_ISSUER: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_ISSUER:-https://sandbox-pay.orbifinancial.com}
      PAYMENT_GATEWAY_OIDC_IDENTITY_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_OIDC_IDENTITY_AUDIENCE:-orbi-pay-sandbox-identity}
      PAYMENT_GATEWAY_OIDC_AUTHORIZATION_CLIENT_ID: ${PAYMENT_GATEWAY_SANDBOX_OIDC_AUTHORIZATION_CLIENT_ID:-orbi-pay-sandbox-developers}
      PAYMENT_GATEWAY_FINANCIAL_TOKEN_AUDIENCE: ${PAYMENT_GATEWAY_SANDBOX_FINANCIAL_TOKEN_AUDIENCE:-orbi-pay-sandbox-api}
      PAYMENT_GATEWAY_PROVIDER_MANIFEST_PATH: /app/config/providers.json
      PAYMENT_GATEWAY_SERVICE_REGISTRY_PATH: /app/config/services.json
      PAYMENT_GATEWAY_OBP_SANDBOX_TOOLS_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_EXPORT_PATH: /app/reconciliation
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_ENABLED: "true"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_INTERVAL_MINUTES: "1440"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_WINDOW_HOURS: "24"
      PAYMENT_GATEWAY_RECONCILIATION_SCHEDULE_RUN_ON_START: "false"
      PAYMENT_GATEWAY_OPERATOR_ALERT_SINK_PATH: /app/alerts/reconciliation-alerts.jsonl
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_ENABLED: "true"
      PAYMENT_GATEWAY_INCIDENT_ESCALATION_INTERVAL_MINUTES: "5"
      PAYMENT_GATEWAY_INCIDENT_CRITICAL_SLA_MINUTES: "15"
      PAYMENT_GATEWAY_INCIDENT_WARNING_SLA_MINUTES: "60"
      PAYMENT_GATEWAY_ORBI_TALK_ENABLED: ${PAYMENT_GATEWAY_SANDBOX_ORBI_TALK_ENABLED:-true}
      ORBI_TALK_GATEWAY_URL: ${ORBI_TALK_GATEWAY_URL:-https://talk.orbifinancial.com}
      ORBI_TALK_MESSAGING_INTENT_PATH: /api/send-email
      ORBI_TALK_GATEWAY_TIMEOUT_MS: ${ORBI_TALK_GATEWAY_TIMEOUT_MS:-2500}
      PAYMENT_GATEWAY_MESSAGING_DELIVERY_STORE_PATH: /app/messaging/messaging-deliveries.json
    volumes:
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/providers.example.json:/app/config/providers.json:ro
      - ${ORBI_PAY_GATEWAY_BACKEND_ROOT:-../../../../../../ORBI GATEWAY/Pay Gateway Backend}/config/services.json:/app/config/services.json:ro
      - ${ORBI_PAY_GATEWAY_RECONCILIATION_SANDBOX_REPORTS_ROOT:-../../../../../../ORBI GATEWAY/Reconciliation Reports/sandbox}:/app/reconciliation
      - ${ORBI_PAY_GATEWAY_ALERTS_SANDBOX_ROOT:-../../../../../../ORBI GATEWAY/Operator Alerts/sandbox}:/app/alerts
      - ${ORBI_PAY_GATEWAY_MESSAGING_SANDBOX_ROOT:-../../../../../../ORBI GATEWAY/Messaging Deliveries/sandbox}:/app/messaging
      - ${ORBI_PAY_GATEWAY_SANDBOX_MTLS_CERT_DIRECTORY:-D:/FYNIX/ORBI/SECREATES/ORBI_MTLS_SANDBOX}:/opt/orbi/mtls:ro
    ports:
      - "${ORBI_PAY_GATEWAY_SANDBOX_BIND_ADDRESS:-127.0.0.1}:3101:3101"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - orbi_private
      - orbi_edge

networks:
  orbi_private:
    name: orbi-private
    external: true
  orbi_edge:
    name: orbi-edge
    external: true
