global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/orbi-alerts.yml

scrape_configs:
  - job_name: orbi-core
    metrics_path: /api/admin/monitor/operational-metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/orbi_monitor_api_key
    static_configs:
      - targets:
          - core:3000
