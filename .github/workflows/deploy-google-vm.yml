name: Deploy Google VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, google]
    timeout-minutes: 35

    env:
      APP_DIR: /home/auth_fynix/apps/orbi-core
      ORBI_REPOSITORY_URL: https://github.com/devfynix-a11y/ORBI-Insitutional-Core-V3.0.0-Stable-Preview.git
      ORBI_BRANCH: main
      ORBI_IMAGE: orbi-core:latest
      HOST_PORT: 3000

    steps:
      - name: Deploy locally on Google VM
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const appDir = process.env.APP_DIR;
            const repositoryUrl = process.env.ORBI_REPOSITORY_URL;
            const branch = process.env.ORBI_BRANCH;
            const image = process.env.ORBI_IMAGE;
            const hostPort = process.env.HOST_PORT;

            const run = (command, args, options = {}) => {
              core.info(`Running ${command} ${args.join(' ')}`);
              return execFileSync(command, args, {
                cwd: options.cwd,
                encoding: 'utf8',
                stdio: 'inherit',
              });
            };

            if (!fs.existsSync(path.join(appDir, '.git'))) {
              fs.mkdirSync(path.dirname(appDir), { recursive: true });
              run('git', ['clone', repositoryUrl, appDir]);
            }

            run('git', ['remote', 'set-url', 'origin', repositoryUrl], { cwd: appDir });
            run('git', ['fetch', 'origin', branch], { cwd: appDir });
            run('git', ['reset', '--hard', `origin/${branch}`], { cwd: appDir });

            const envPath = path.join(appDir, '.env');
            if (!fs.existsSync(envPath)) {
              core.setFailed(`Missing ${envPath}. Upload the Google production env file before deploy.`);
              return;
            }
            fs.chmodSync(envPath, 0o600);

            run('docker', ['build', '-t', image, '.'], { cwd: appDir });
            try {
              run('docker', ['rm', '-f', 'orbi-core-api'], { cwd: appDir });
            } catch {
              core.info('Existing orbi-core-api container was not present.');
            }
            run('docker', [
              'run',
              '-d',
              '--name', 'orbi-core-api',
              '--restart', 'unless-stopped',
              '--env-file', '.env',
              '-p', `${hostPort}:3000`,
              image,
            ], { cwd: appDir });

            await new Promise((resolve) => setTimeout(resolve, 8000));
            const response = await fetch(`http://127.0.0.1:${hostPort}/health`, {
              headers: { 'X-Forwarded-Proto': 'https' },
            });
            const body = await response.text();
            core.info(`Health response ${response.status}: ${body}`);
            if (!response.ok) {
              core.setFailed(`Google VM health check failed with HTTP ${response.status}.`);
            }
