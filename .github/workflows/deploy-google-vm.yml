name: Deploy Google VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, google]
    timeout-minutes: 35

    env:
      APP_DIR: /home/auth_fynix/apps/orbi-core
      ORBI_REPOSITORY_URL: https://github.com/devfynix-a11y/ORBI-Insitutional-Core-V3.0.0-Stable-Preview.git
      ORBI_BRANCH: main
      ORBI_IMAGE: orbi-core:latest
      HOST_PORT: 3000
      TLS_DIR: /opt/orbi/mtls

    steps:
      - name: Deploy locally on Google VM
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const appDir = process.env.APP_DIR;
            const repositoryUrl = process.env.ORBI_REPOSITORY_URL;
            const branch = process.env.ORBI_BRANCH;
            const image = process.env.ORBI_IMAGE;
            const hostPort = process.env.HOST_PORT;
            const tlsDir = process.env.TLS_DIR;

            const run = (command, args, options = {}) => {
              core.info(`Running ${command} ${args.join(' ')}`);
              return execFileSync(command, args, {
                cwd: options.cwd,
                encoding: 'utf8',
                stdio: 'inherit',
              });
            };

            if (!fs.existsSync(path.join(appDir, '.git'))) {
              fs.mkdirSync(path.dirname(appDir), { recursive: true });
              run('git', ['clone', repositoryUrl, appDir]);
            }

            run('git', ['remote', 'set-url', 'origin', repositoryUrl], { cwd: appDir });
            run('git', ['fetch', 'origin', branch], { cwd: appDir });
            run('git', ['reset', '--hard', `origin/${branch}`], { cwd: appDir });

            const envPath = path.join(appDir, '.env');
            if (!fs.existsSync(envPath)) {
              core.setFailed(`Missing ${envPath}. Upload the Google production env file before deploy.`);
              return;
            }
            fs.chmodSync(envPath, 0o600);
            if (!fs.existsSync(tlsDir)) {
              core.setFailed(`Missing Google VM TLS directory: ${tlsDir}`);
              return;
            }

            run('docker', ['build', '-t', image, '.'], { cwd: appDir });
            try {
              run('docker', ['rm', '-f', 'orbi-core-api'], { cwd: appDir });
            } catch {
              core.info('Existing orbi-core-api container was not present.');
            }
            run('docker', [
              'run',
              '-d',
              '--name', 'orbi-core-api',
              '--restart', 'unless-stopped',
              '--env-file', '.env',
              '--volume', `${tlsDir}:${tlsDir}:ro`,
              '-p', `${hostPort}:3000`,
              image,
            ], { cwd: appDir });

            let lastHealthError = 'Health endpoint did not respond.';
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              for (const protocol of ['https', 'http']) {
                try {
                  const body = execFileSync('curl', [
                    '--insecure',
                    '--fail',
                    '--show-error',
                    '--silent',
                    '--header', 'X-Forwarded-Proto: https',
                    `${protocol}://127.0.0.1:${hostPort}/health`,
                  ], { encoding: 'utf8' });
                  core.info(`Health attempt ${attempt} over ${protocol.toUpperCase()} succeeded: ${body}`);
                  return;
                } catch (error) {
                  lastHealthError = error instanceof Error ? error.message : String(error);
                }
              }
              core.warning(`Health attempt ${attempt} failed: ${lastHealthError}`);
            }

            try {
              run('docker', ['ps', '-a', '--filter', 'name=orbi-core-api'], { cwd: appDir });
              run('docker', ['logs', '--tail', '200', 'orbi-core-api'], { cwd: appDir });
            } catch (error) {
              core.warning(`Unable to collect container diagnostics: ${error}`);
            }
            core.setFailed(`Google VM health check failed after 90 seconds: ${lastHealthError}`);
